# Re-renders the article, topic and listing pages from Sanity and commits the
# result, so publishing in the Studio reaches the website without anyone
# opening a terminal.
#
# The site is static by design: pages are generated from Sanity at build time.
# That is what keeps it fast and indexable, but it means a publish in Sanity
# changes nothing until a build runs. This workflow is that build.
#
# Three ways in:
#   - repository_dispatch  a Sanity webhook fires the moment content is
#                          published (see scripts/setup-webhook.mjs)
#   - schedule             a safety net, in case a webhook is ever missed
#   - workflow_dispatch    the "Run workflow" button, for a manual re-sync
#
# Pushing the regenerated pages is what triggers the Hostinger deploy.
name: Sync content from Sanity

on:
  repository_dispatch:
    types: [sanity-publish]
  schedule:
    # Every 30 minutes. Cheap, and bounds how long a missed webhook can leave
    # the site stale.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Queue runs rather than running them in parallel: two jobs committing
# generated pages at once would conflict.
concurrency:
  group: sync-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Render pages from Sanity
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || 'pvj2zu1w' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run sanity:sync

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No content changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Content sync from Sanity

          Regenerated by .github/workflows/sync-content.yml."
          git push
          echo "Pushed regenerated pages."

      # Only needed if Hostinger does NOT auto-deploy on push. Add a
      # HOSTINGER_DEPLOY_HOOK secret and this fires it; with no secret set the
      # step no-ops, so it is safe to leave in either way.
      - name: Trigger Hostinger deploy
        env:
          HOOK: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No HOSTINGER_DEPLOY_HOOK secret set - relying on deploy-on-push."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" && echo "Hostinger deploy triggered."
